name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Windows UI dependency
        run: python -m pip install -r requirements-windows.txt
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Check public file list
        run: python scripts/package_source.py --check
  checks:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Check public file list
        run: python3 scripts/package_source.py --check
      - name: Build macOS application
        run: python3 build.py
      - name: Swift calculation and process checks
        run: |
          .build/Codex额度悬浮窗.app/Contents/MacOS/CodexQuotaWidget --check-guidance
          .build/Codex额度悬浮窗.app/Contents/MacOS/CodexQuotaWidget --check-reader "$(command -v python3)"
